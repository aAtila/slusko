[project]
name = "slusko-worker"
version = "0.1.0"
description = "Minimal Slusko worker scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
slusko-worker = "slusko_worker.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
