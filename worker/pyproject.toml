[project]
name = "slusko-worker"
version = "0.1.0"
description = "Minimal Slusko worker scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper>=1.1,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2,<3",
  "pyannote.audio>=3,<4",
  # pyannote.audio 3.x still references torchaudio.AudioMetaData, which was
  # removed from torchaudio 2.9+. Keep torch/torchaudio on the compatible line.
  "torch==2.8.0",
  "torchaudio==2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
slusko-worker = "slusko_worker.main:main"
slusko-worker-preload-models = "slusko_worker.preload_models:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
