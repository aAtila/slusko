services:
  migrate:
    profiles: ["tools"]
    build:
      context: ./web
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: bun run db:migrate

  web:
    build:
      context: ./web
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
      PORT: 5173
    expose:
      - "5173"
    restart: unless-stopped
    volumes:
      - slusko_meetings:/data/meetings

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MEETINGS_DIR: /data/meetings
      MODEL_CACHE_DIR: /data/models
      HF_HOME: /data/models
      HF_TOKEN: ${HF_TOKEN:-}
    restart: unless-stopped
    volumes:
      - slusko_meetings:/data/meetings
      - slusko_models:/data/models

volumes:
  slusko_meetings:
  slusko_models:
