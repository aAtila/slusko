services:
  migrate:
    profiles: ["tools"]
    build:
      context: ./web
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: bun run db:migrate

  web:
    build:
      context: ./web
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
      PORT: 5173
    expose:
      - "5173"
    restart: unless-stopped
    volumes:
      - slusko_meetings:/data/meetings

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MEETINGS_DIR: /data/meetings
      MODEL_CACHE_DIR: /data/models
      HF_HOME: /data/models
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      PYANNOTE_MODEL: ${PYANNOTE_MODEL:-pyannote/speaker-diarization-3.1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:?OPENROUTER_MODEL is required}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-120}
    restart: unless-stopped
    volumes:
      - slusko_meetings:/data/meetings
      - slusko_models:/data/models

volumes:
  slusko_meetings:
  slusko_models:
